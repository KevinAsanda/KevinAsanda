<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Kevin Asanda Manzini</title>
  <desc id="d">Devtunes Records, Vol. 01. Code. Create. Repeat. A spinning vinyl record with a code symbol on its label.</desc>
  <defs>
